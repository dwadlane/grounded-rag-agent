name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Eval gate (fails on any wrong answer or recall@5 under 90%)
        run: npm run eval
      - name: Report is up to date
        run: npm run demo && git diff --exit-code eval/report.md examples/demo-output.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval/report.md
